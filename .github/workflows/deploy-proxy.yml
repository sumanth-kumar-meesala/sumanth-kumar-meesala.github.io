name: Deploy Groq proxy (Cloudflare Worker)

# The Groq key never enters the repository: it lives in GitHub Actions
# secrets and is pushed to the worker as a Cloudflare secret at deploy time.
#
# Required repository secrets:
#   GROQ_API_KEY            the Groq API key
#   CLOUDFLARE_API_TOKEN    Cloudflare token with "Workers Scripts: Edit"
#   CLOUDFLARE_ACCOUNT_ID   Cloudflare account id
# Then set the repository *variable* VITE_ASK_ENDPOINT to the worker URL
# printed by this workflow (e.g. https://ask-sumanth.<account>.workers.dev)
# so the Pages build points the site at it.

on:
  push:
    branches: ["main", "master"]
    paths:
      - "proxy/**"
      - ".github/workflows/deploy-proxy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install wrangler
        run: npm install --no-audit --no-fund
      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Set Groq key on the worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: printf '%s' "$GROQ_API_KEY" | npx wrangler secret put GROQ_API_KEY
